name: Build iOS (.ipa sem assinatura)

# Usa o pygame-ios (https://github.com/seekerluke/pygame-ios), que gera um
# projeto Xcode a partir do jogo. O autor avisa que a ferramenta e
# experimental — por isso o log vai inteiro para a Release.
#
# Versoes FIXAS de proposito: so existem templates para pygame-ce 2.5.5 e
# 2.5.6. Deixar flutuante quebra o build sem ninguem ter mexido em nada.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYGAME_CE_VERSION: "2.5.6"
  APP_NOME: "Vale do Girassol"
  APP_BUNDLE_ID: "br.isabellaradael.valedogirassol"

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # 3.13 no minimo: o pygame-ios declara Requires-Python >=3.13
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Ambiente
        run: |
          {
            echo "===== ambiente ====="
            xcodebuild -version
            python --version
          } 2>&1 | tee -a build.log

      - name: Instalar pygame-ios
        run: |
          python -m pip install --upgrade pip 2>&1 | tee -a build.log
          pip install pygame-ios 2>&1 | tee -a build.log

      # O jogo e 100% procedural: nenhuma imagem, fonte ou audio em arquivo.
      # So os modulos .py precisam ir junto.
      - name: Preparar pasta do jogo
        run: |
          mkdir -p jogo
          cp *.py jogo/
          echo "===== arquivos enviados =====" | tee -a build.log
          ls -1 jogo | tee -a build.log

      - name: Gerar projeto Xcode
        id: gen
        continue-on-error: true
        run: |
          set -o pipefail
          yes "" | pygame_ios jogo main.py "$PYGAME_CE_VERSION" 2>&1 | tee -a build.log

      - name: Localizar o projeto gerado
        if: always()
        run: |
          {
            echo "===== resultado do pygame_ios: ${{ steps.gen.outcome }} ====="
            echo "===== .xcodeproj / .xcworkspace ====="
            find . -maxdepth 4 \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) 2>/dev/null
          } 2>&1 | tee -a build.log

      - name: Compilar sem assinatura
        id: build
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          PROJ="$(find . -maxdepth 4 -name '*.xcodeproj' 2>/dev/null | head -1)"
          if [ -z "$PROJ" ]; then
            echo "nenhum .xcodeproj gerado — nada a compilar" | tee -a build.log
            exit 1
          fi
          echo "projeto: $PROJ" | tee -a build.log
          xcodebuild -list -project "$PROJ" 2>&1 | tee -a build.log
          SCHEME="$(xcodebuild -list -project "$PROJ" 2>/dev/null \
                    | awk '/Schemes:/{f=1;next} f&&NF{print $1;exit}')"
          echo "scheme: $SCHEME" | tee -a build.log
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath dd \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee -a build.log

      # O template vem com nome, bundle id e orientacoes genericos. Como o app
      # esta sem assinatura, da para ajustar o Info.plist aqui sem quebrar nada
      # — quem assina e o SideStore, depois.
      - name: Personalizar o app
        if: always()
        continue-on-error: true
        run: |
          APP="$(find dd -name '*.app' -type d 2>/dev/null | head -1)"
          if [ -z "$APP" ]; then
            echo "sem .app para personalizar" | tee -a build.log
            exit 0
          fi
          PL="$APP/Info.plist"
          PB=/usr/libexec/PlistBuddy

          "$PB" -c "Set :CFBundleDisplayName $APP_NOME" "$PL" 2>/dev/null \
            || "$PB" -c "Add :CFBundleDisplayName string $APP_NOME" "$PL"
          "$PB" -c "Set :CFBundleName $APP_NOME" "$PL" 2>/dev/null || true
          "$PB" -c "Set :CFBundleIdentifier $APP_BUNDLE_ID" "$PL" 2>/dev/null || true

          # o jogo e 640x360 paisagem: travar a orientacao evita deformar em retrato
          "$PB" -c "Delete :UISupportedInterfaceOrientations" "$PL" 2>/dev/null || true
          "$PB" -c "Add :UISupportedInterfaceOrientations array" "$PL"
          "$PB" -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PL"
          "$PB" -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PL"

          # icone: reaproveita o que ja existe no repositorio para a versao web
          if [ -f web/icone.png ]; then
            sips -s format png -z 180 180 web/icone.png --out "$APP/AppIcon60x60@3x.png" >/dev/null 2>&1 || true
            sips -s format png -z 120 120 web/icone.png --out "$APP/AppIcon60x60@2x.png" >/dev/null 2>&1 || true
            "$PB" -c "Delete :CFBundleIconFiles" "$PL" 2>/dev/null || true
            "$PB" -c "Add :CFBundleIconFiles array" "$PL"
            "$PB" -c "Add :CFBundleIconFiles:0 string AppIcon60x60" "$PL"
          fi

          echo "===== Info.plist final =====" | tee -a build.log
          "$PB" -c Print "$PL" 2>&1 \
            | grep -iE "BundleName|BundleDisplayName|BundleIdentifier|Orientation|IconFiles" \
            | tee -a build.log

      - name: Empacotar em .ipa
        if: always()
        continue-on-error: true
        run: |
          APP="$(find dd -name '*.app' -type d 2>/dev/null | head -1)"
          if [ -n "$APP" ]; then
            echo "app: $APP" | tee -a build.log
            rm -rf Payload && mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry vale-do-girassol.ipa Payload
            ls -lh vale-do-girassol.ipa | tee -a build.log
          else
            echo "nenhum .app gerado — publicando so o log" | tee -a build.log
          fi

      - name: Publicar
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "build ${{ github.run_number }}"
          body: |
            .ipa sem assinatura, para instalar pelo SideStore.
            build.log vai junto para diagnostico.
          files: |
            vale-do-girassol.ipa
            build.log
          fail_on_unmatched_files: false

      # Fonte do SideStore: com ela o jogo aparece dentro do app com botao
      # "Atualizar", em vez de baixar .ipa na mao a cada build.
      # O commit leva [skip ci] para nao disparar o workflow de novo.
      - name: Gerar source.json
        if: always()
        continue-on-error: true
        env:
          IPA_NAME: vale-do-girassol.ipa
          REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
          SOURCE_NOME: "Jogos da Isabella"
          SOURCE_ID: "br.isabellaradael.source.valedogirassol"
          APP_SUBTITULO: "RPG de fazenda em pixel art"
          APP_DESCRICAO: "Um RPG de escolhas numa fazenda, em pixel art. Plante, crie animais, cuide do celeiro e atravesse as estacoes."
          APP_ICONE_URL: "https://raw.githubusercontent.com/isabellaR-a6/vale-do-girassol/main/web/icone.png"
        run: |
          python3 tools/gerar_source.py 2>&1 | tee -a build.log || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Atualiza source.json para ${TAG} [skip ci]" || exit 0
          git push
